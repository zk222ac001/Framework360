name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: framework360_test
          POSTGRES_USER: framework360
          POSTGRES_PASSWORD: framework360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U framework360 -d framework360_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://framework360:framework360@localhost:5432/framework360_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      CORS_ORIGIN: http://localhost:5173
      STORAGE_DRIVER: local
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run backend tests
        run: npm test

      - name: Run backend production audit
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run frontend production audit
        run: npm audit --omit=dev --audit-level=high
